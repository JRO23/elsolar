<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Solar App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Ocultar barra de desplazamiento manteniendo funcionalidad */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        
        /* Animaciones base */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        @keyframes bounce-subtle { 0%, 100% { transform: translateY(-5%); } 50% { transform: translateY(0); } }
        .animate-bounce-subtle { animation: bounce-subtle 2s infinite ease-in-out; }
    </style>
</head>
<body class="font-sans text-slate-900 bg-slate-50 min-h-screen selection:bg-blue-200">

    <!-- Contenedor de Notificaciones Toast -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-[90%] max-w-md pointer-events-none"></div>

    <!-- VISTA: LOGIN -->
    <div id="view-login" class="min-h-screen flex items-center justify-center bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-100 via-slate-50 to-white p-4 transition-opacity duration-300">
        <div class="w-full max-w-md glass-panel rounded-[2.5rem] p-8 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] border border-white fade-in">
            <div class="w-24 h-24 bg-black rounded-[2rem] mx-auto mb-8 flex items-center justify-center shadow-2xl transform -rotate-3 transition-transform hover:rotate-0">
                <i data-lucide="target" class="w-12 h-12 text-white"></i>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-center mb-2 text-slate-900">El Solar</h1>
            <p class="text-slate-500 text-center font-medium mb-10 text-lg">Reserva Virtual de Juegos</p>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-2 ml-1">Correo Institucional</label>
                    <input
                        type="email"
                        id="email-input"
                        placeholder="nombre.apellido@uexternado.edu.co"
                        class="w-full px-5 py-4 rounded-2xl bg-slate-100/80 border-2 border-transparent focus:border-blue-200 focus:bg-white outline-none transition-all text-base font-bold text-slate-800 placeholder:text-slate-400"
                        required
                    />
                    <p id="login-error" class="text-red-500 text-sm font-bold mt-2 ml-1 hidden flex items-center gap-1">
                        <i data-lucide="alert-circle" class="w-4 h-4"></i> Formato inválido. Debe ser: nombre.apellido@uexternado.edu.co
                    </p>
                </div>
                
                <button type="submit" class="w-full bg-black text-white py-4 mt-2 rounded-2xl font-bold text-lg flex items-center justify-center gap-3 hover:bg-slate-800 transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg">
                    Ingresar <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- VISTA: DASHBOARD -->
    <div id="view-dashboard" class="hidden min-h-screen pb-20 fade-in">
        <nav class="glass-panel sticky top-0 z-10 border-b border-slate-200">
            <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center"><i data-lucide="target" class="w-6 h-6 text-white"></i></div>
                    <span class="font-bold text-xl hidden sm:block">El Solar</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-badge" class="font-bold text-slate-700 bg-slate-100 px-4 py-2 rounded-full text-sm flex items-center gap-2"></span>
                    <button onclick="appState.logout()" class="p-2 hover:bg-slate-200 rounded-full text-slate-500 transition-colors"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                </div>
            </div>
        </nav>

        <div class="max-w-6xl mx-auto px-6 pt-8">
            <!-- Contenedor de Estados Activos (Reserva o Fila) -->
            <div id="active-status-container" class="mb-8 empty:hidden"></div>

            <h2 class="text-3xl font-bold mb-6">¿Qué quieres jugar hoy?</h2>
            
            <div id="filters-container" class="flex overflow-x-auto gap-3 pb-4 mb-4 no-scrollbar"></div>
            <div id="resources-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>
    </div>

    <!-- VISTA: SALA DE ESPERA -->
    <div id="view-waiting" class="hidden min-h-screen flex-col fade-in">
        <div class="bg-white border-b border-slate-200 p-4 flex justify-between items-center">
            <button onclick="appState.changeView('dashboard')" class="font-medium text-slate-500 hover:text-black transition-colors">← Volver al Panel</button>
            <span class="font-bold">Sala de Espera</span>
            <div class="w-20"></div>
        </div>

        <div class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col gap-8">
            <div id="waiting-status-card" class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 flex flex-col md:flex-row items-center gap-8 text-center md:text-left">
                <!-- Se llena por JS -->
            </div>

            <div>
                <h3 class="text-2xl font-bold mb-6">Pasa el tiempo jugando</h3>
                
                <div id="minigames-menu" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    <!-- Tarjetas de minijuegos -->
                    <button onclick="games.start('memory')" class="bg-white p-6 rounded-3xl text-left border border-slate-100 hover:shadow-lg hover:-translate-y-1 transition-all group h-full">
                        <div class="w-14 h-14 bg-purple-100 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"><i data-lucide="layers" class="w-7 h-7 text-purple-600"></i></div>
                        <h4 class="text-xl font-bold mb-2">Memoria</h4>
                        <p class="text-slate-500 text-sm">Encuentra las parejas.</p>
                    </button>
                    <button onclick="games.start('tictactoe')" class="bg-white p-6 rounded-3xl text-left border border-slate-100 hover:shadow-lg hover:-translate-y-1 transition-all group h-full">
                        <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"><i data-lucide="hash" class="w-7 h-7 text-blue-600"></i></div>
                        <h4 class="text-xl font-bold mb-2">Tres en Raya</h4>
                        <p class="text-slate-500 text-sm">Clásico contra el Bot.</p>
                    </button>
                    <button onclick="games.start('connect4')" class="bg-white p-6 rounded-3xl text-left border border-slate-100 hover:shadow-lg hover:-translate-y-1 transition-all group h-full">
                        <div class="w-14 h-14 bg-red-100 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"><i data-lucide="grid-3x3" class="w-7 h-7 text-red-600"></i></div>
                        <h4 class="text-xl font-bold mb-2">4 en Raya</h4>
                        <p class="text-slate-500 text-sm">Conecta 4 fichas seguidas.</p>
                    </button>
                    <button onclick="games.start('whack')" class="bg-white p-6 rounded-3xl text-left border border-slate-100 hover:shadow-lg hover:-translate-y-1 transition-all group h-full">
                        <div class="w-14 h-14 bg-orange-100 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform"><i data-lucide="hammer" class="w-7 h-7 text-orange-600"></i></div>
                        <h4 class="text-xl font-bold mb-2">Caza de Topos</h4>
                        <p class="text-slate-500 text-sm">Pon a prueba tus reflejos.</p>
                    </button>
                </div>

                <div id="minigame-active-container" class="hidden bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <h4 id="minigame-title" class="text-xl font-bold">Juego</h4>
                        <button onclick="games.stop()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-full text-sm font-medium transition-colors">Volver a Juegos</button>
                    </div>
                    <!-- Área donde se inyecta el juego activo -->
                    <div id="minigame-canvas" class="relative w-full h-64 sm:h-80 bg-slate-100 rounded-3xl flex items-center justify-center overflow-hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Utilidad de formato de tiempo (MM:SS)
        const formatTime = (totalSeconds) => {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        };

        // Estado Global de la App
        const appState = {
            view: 'login', // 'login', 'dashboard', 'waiting'
            email: '',
            filter: 'Todos',
            activeQueue: null, // { resourceId, position, estimatedTime }
            activeReservation: null, // { resourceId, timeRemaining }
            
            // Base de datos simulada
            resources: [
                { id: 'pp1', name: 'Mesa Ping Pong 1', category: 'Deportes', icon: 'activity', status: 'available', timeRemaining: 0, queue: 0 },
                { id: 'pp2', name: 'Mesa Ping Pong 2', category: 'Deportes', icon: 'activity', status: 'occupied', timeRemaining: 15, queue: 1 }, // Ideal para demo de liberación
                { id: 'cons1', name: 'Consola FIFA', category: 'Videojuegos', icon: 'gamepad-2', status: 'occupied', timeRemaining: 45, queue: 2 }, // Ideal para entrar a fila
                { id: 'cons2', name: 'Consola Smash', category: 'Videojuegos', icon: 'gamepad-2', status: 'available', timeRemaining: 0, queue: 0 },
                { id: 'cart1', name: 'Cartas Poker', category: 'Juegos de Mesa', icon: 'layers', status: 'available', timeRemaining: 0, queue: 0 },
                { id: 'uno1', name: 'Juego UNO', category: 'Juegos de Mesa', icon: 'layers', status: 'occupied', timeRemaining: 30, queue: 1 },
                { id: 'ajed1', name: 'Ajedrez', category: 'Juegos de Mesa', icon: 'box', status: 'available', timeRemaining: 0, queue: 0 },
                { id: 'rumm1', name: 'Rummikub', category: 'Juegos de Mesa', icon: 'box', status: 'occupied', timeRemaining: 120, queue: 0 },
                { id: 'fut1', name: 'Balón de Fútbol', category: 'Deportes', icon: 'circle', status: 'available', timeRemaining: 0, queue: 0 },
                { id: 'bas1', name: 'Balón Baloncesto', category: 'Deportes', icon: 'trophy', status: 'occupied', timeRemaining: 60, queue: 3 },
            ],

            changeView: function(newView) {
                document.getElementById(`view-${this.view}`).classList.add('hidden');
                document.getElementById(`view-${newView}`).classList.remove('hidden');
                this.view = newView;
                
                if (newView === 'dashboard') ui.renderDashboard();
                if (newView === 'waiting') ui.renderWaitingRoom();
                
                // Si salimos de waiting, paramos el minijuego
                if (newView !== 'waiting') games.stop();
                
                lucide.createIcons();
            },

            logout: function() {
                this.email = '';
                this.activeQueue = null;
                this.activeReservation = null;
                document.getElementById('email-input').value = '';
                this.changeView('login');
            }
        };

        const ui = {
            showToast: function(message, type = 'success') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `px-6 py-4 rounded-full shadow-2xl flex items-center gap-3 fade-in pointer-events-auto ${type === 'success' ? 'bg-black text-white' : 'bg-white text-slate-800 border border-slate-200'}`;
                
                const icon = type === 'success' ? '<i data-lucide="check-circle-2" class="w-5 h-5 text-green-400"></i>' : '<i data-lucide="info" class="w-5 h-5 text-blue-500"></i>';
                
                toast.innerHTML = `
                    ${icon}
                    <div class="font-medium whitespace-nowrap">${message}</div>
                    <button class="ml-2 text-slate-400 hover:text-current transition-colors" onclick="this.parentElement.remove()"><i data-lucide="x" class="w-5 h-5"></i></button>
                `;
                container.appendChild(toast);
                lucide.createIcons();

                setTimeout(() => {
                    if(toast.parentElement) {
                        toast.style.opacity = '0';
                        toast.style.transform = 'translateY(-10px)';
                        toast.style.transition = 'all 0.3s ease';
                        setTimeout(() => toast.remove(), 300);
                    }
                }, 4000);
            },

            renderDashboard: function() {
                const shortName = appState.email.split('@')[0];
                document.getElementById('user-badge').innerHTML = `<span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> ${shortName}`;
                
                // Filtros
                const categories = ['Todos', ...new Set(appState.resources.map(r => r.category))];
                const filtersHtml = categories.map(cat => `
                    <button onclick="appState.filter = '${cat}'; ui.renderDashboard()" class="px-5 py-2.5 rounded-full font-medium whitespace-nowrap transition-all ${appState.filter === cat ? 'bg-black text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                        ${cat}
                    </button>
                `).join('');
                document.getElementById('filters-container').innerHTML = filtersHtml;

                // Render Grid & Active Status (Delegamos a las funciones de actualización para no duplicar código)
                this.updateActiveStatus();
                this.updateGrid();
            },

            updateActiveStatus: function() {
                if (appState.view !== 'dashboard') return;
                
                const container = document.getElementById('active-status-container');
                let html = '';

                if (appState.activeReservation) {
                    const res = appState.resources.find(r => r.id === appState.activeReservation.resourceId);
                    if (res) {
                        html = `
                        <div class="bg-green-500 text-white rounded-3xl p-6 shadow-lg shadow-green-500/20 flex flex-col sm:flex-row items-center justify-between gap-4 fade-in">
                            <div class="flex items-center gap-4">
                                <div class="p-3 bg-white/20 rounded-2xl"><i data-lucide="${res.icon}" class="w-8 h-8"></i></div>
                                <div>
                                    <h2 class="text-sm font-semibold text-green-100 uppercase tracking-wider mb-1">Reserva Activa</h2>
                                    <p class="text-2xl font-bold">${res.name}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-6 justify-center sm:justify-end w-full sm:w-auto">
                                <div class="text-center sm:text-right">
                                    <div class="text-4xl font-black tabular-nums tracking-tight">${formatTime(appState.activeReservation.timeRemaining)}</div>
                                    <div class="text-sm font-medium text-green-100">Tiempo restante</div>
                                </div>
                                <button onclick="actions.cancelReservation()" class="bg-red-500 hover:bg-red-600 text-white p-4 rounded-2xl transition-all shadow-md flex-shrink-0" title="Cancelar Reserva">
                                    <i data-lucide="x" class="w-6 h-6"></i>
                                </button>
                            </div>
                        </div>`;
                    }
                } else if (appState.activeQueue) {
                    const res = appState.resources.find(r => r.id === appState.activeQueue.resourceId);
                    if (res) {
                        html = `
                        <div class="bg-black text-white rounded-3xl p-6 shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4 fade-in">
                            <div class="flex items-center gap-4">
                                <div class="p-3 bg-white/10 rounded-2xl animate-pulse"><i data-lucide="users" class="w-8 h-8"></i></div>
                                <div>
                                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-1">En fila virtual</h2>
                                    <p class="text-2xl font-bold">${res.name}</p>
                                </div>
                            </div>
                            <button onclick="appState.changeView('waiting')" class="px-6 py-3 bg-white text-black rounded-xl font-bold hover:bg-slate-200 transition-colors whitespace-nowrap">
                                Ir a la Sala de Espera
                            </button>
                        </div>`;
                    }
                }

                if(container.innerHTML !== html) {
                    container.innerHTML = html;
                    lucide.createIcons();
                }
            },

            updateGrid: function() {
                if (appState.view !== 'dashboard') return;

                const grid = document.getElementById('resources-grid');
                const filtered = appState.filter === 'Todos' ? appState.resources : appState.resources.filter(r => r.category === appState.filter);
                
                // En lugar de recrear el DOM que arruina el scroll, generamos un HTML y si es igual no tocamos, o generamos limpio. 
                // Para JS vainilla simple, reescribiremos todo pero solo si es necesario, o lo generamos completo (el parpadeo es mínimo en HTML puro sin imágenes pesadas).
                let html = '';
                filtered.forEach(res => {
                    const isAvailable = res.status === 'available';
                    const isMyRes = appState.activeReservation !== null;
                    const isMyQueueDiff = appState.activeQueue !== null && appState.activeQueue.resourceId !== res.id;
                    const isDisabled = isMyRes || isMyQueueDiff;

                    html += `
                    <div class="bg-white rounded-3xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 transition-all duration-300 hover:shadow-xl hover:-translate-y-1 flex flex-col h-full">
                        <div class="flex justify-between items-start mb-6">
                            <div class="p-3 bg-slate-50 rounded-2xl">
                                <i data-lucide="${res.icon}" class="w-8 h-8 ${isAvailable ? 'text-blue-600' : 'text-slate-400'}"></i>
                            </div>
                            <span class="px-3 py-1.5 rounded-full text-xs font-bold tracking-wide ${isAvailable ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}">
                                ${isAvailable ? 'DISPONIBLE' : 'OCUPADO'}
                            </span>
                        </div>
                        
                        <h3 class="text-xl font-bold mb-1 text-slate-900">${res.name}</h3>
                        <p class="text-sm font-medium text-slate-400 mb-6 flex-grow">${res.category}</p>

                        <div class="flex items-center gap-4 text-sm font-medium text-slate-600 mb-6 bg-slate-50 p-3 rounded-xl h-12">
                            ${!isAvailable ? `
                                <div class="flex items-center gap-1.5 tabular-nums"><i data-lucide="clock" class="w-4 h-4 text-slate-400"></i> ${formatTime(res.timeRemaining)}</div>
                                <div class="w-px h-4 bg-slate-200"></div>
                                <div class="flex items-center gap-1.5"><i data-lucide="users" class="w-4 h-4 text-slate-400"></i> ${res.queue} en fila</div>
                            ` : `
                                <div class="flex items-center gap-1.5 text-green-600 font-bold"><i data-lucide="check-circle-2" class="w-4 h-4"></i> Listo para jugar</div>
                            `}
                        </div>

                        <button 
                            onclick="${isAvailable ? `actions.reserve('${res.id}')` : `actions.queue('${res.id}')`}"
                            ${isDisabled ? 'disabled' : ''}
                            class="w-full py-4 rounded-xl font-bold transition-all ${isAvailable ? 'bg-black text-white hover:bg-slate-800' : 'bg-blue-50 text-blue-600 hover:bg-blue-100'} disabled:opacity-50 disabled:cursor-not-allowed">
                            ${isAvailable ? 'Reservar Ahora' : 'Entrar a Fila Virtual'}
                        </button>
                    </div>`;
                });
                
                grid.innerHTML = html;
                lucide.createIcons();
            },

            renderWaitingRoom: function() {
                if (!appState.activeQueue) return;
                const res = appState.resources.find(r => r.id === appState.activeQueue.resourceId);
                
                const card = document.getElementById('waiting-status-card');
                card.innerHTML = `
                    <div class="w-32 h-32 rounded-full border-8 border-blue-100 flex items-center justify-center flex-shrink-0 bg-white">
                        <div class="text-4xl font-black text-blue-600">#${appState.activeQueue.position}</div>
                    </div>
                    <div class="flex-1">
                        <h2 class="text-slate-500 font-medium mb-1 uppercase tracking-wider text-sm">Esperando para</h2>
                        <h1 class="text-3xl font-black mb-4">${res ? res.name : ''}</h1>
                        <div class="flex flex-wrap justify-center md:justify-start gap-4">
                            <div class="bg-slate-50 px-4 py-2 rounded-xl flex items-center gap-2 font-medium tabular-nums text-slate-700 border border-slate-200">
                                <i data-lucide="clock" class="w-5 h-5 text-slate-400"></i> ETA: ${formatTime(appState.activeQueue.estimatedTime)}
                            </div>
                        </div>
                    </div>
                    <button onclick="actions.cancelQueue()" class="px-6 py-3 text-red-500 font-bold bg-red-50 hover:bg-red-100 rounded-xl transition-colors whitespace-nowrap border border-red-100">
                        Abandonar Fila
                    </button>
                `;
                lucide.createIcons();
            }
        };

        const actions = {
            reserve: function(resId) {
                const res = appState.resources.find(r => r.id === resId);
                res.status = 'occupied';
                res.timeRemaining = 3600; // 1 hora simulada
                appState.activeReservation = { resourceId: resId, timeRemaining: 3600 };
                ui.showToast(`¡Reserva confirmada para ${res.name}!`);
                ui.renderDashboard();
            },
            
            queue: function(resId) {
                const res = appState.resources.find(r => r.id === resId);
                res.queue += 1;
                appState.activeQueue = { 
                    resourceId: resId, 
                    position: res.queue, 
                    estimatedTime: res.timeRemaining + ((res.queue - 1) * 30)
                };
                appState.changeView('waiting');
            },

            cancelReservation: function() {
                const res = appState.resources.find(r => r.id === appState.activeReservation.resourceId);
                if(res) {
                    res.status = 'available';
                    res.timeRemaining = 0;
                }
                appState.activeReservation = null;
                ui.showToast("Reserva finalizada. ¡Gracias!");
                ui.renderDashboard();
            },

            cancelQueue: function() {
                const res = appState.resources.find(r => r.id === appState.activeQueue.resourceId);
                if(res && res.queue > 0) res.queue -= 1;
                appState.activeQueue = null;
                appState.changeView('dashboard');
            }
        };

        // Evento Login
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value.trim().toLowerCase();
            const regex = /^[a-zA-Z]+\.[a-zA-Z]+[a-zA-Z0-9]*@uexternado\.edu\.co$/;
            
            if (!regex.test(email)) {
                document.getElementById('login-error').classList.remove('hidden');
                document.getElementById('email-input').classList.add('border-red-400', 'bg-red-50');
            } else {
                document.getElementById('login-error').classList.add('hidden');
                appState.email = email;
                appState.changeView('dashboard');
            }
        });
        document.getElementById('email-input').addEventListener('input', function() {
            this.classList.remove('border-red-400', 'bg-red-50');
            document.getElementById('login-error').classList.add('hidden');
        });

        setInterval(() => {
            if (appState.view === 'login') return;
            let needsUpdate = false;

            // 1. Reducir tiempo recursos
            appState.resources.forEach(res => {
                if (res.status === 'occupied' && res.timeRemaining > 0) {
                    res.timeRemaining--;
                    needsUpdate = true;
                    if (res.timeRemaining <= 0) {
                        res.status = 'available';
                        res.timeRemaining = 0;
                        if (res.queue > 0) res.queue--;
                    }
                }
            });

            // 2. Simulación de Realismo (Bots reservando para darle vida)
            // 8% de probabilidad cada segundo de que alguien más reserve algo libre
            if (Math.random() < 0.08) {
                const available = appState.resources.filter(r => r.status === 'available' && r.id !== (appState.activeReservation?.resourceId || '') && r.id !== (appState.activeQueue?.resourceId || ''));
                if (available.length > 0) {
                    const rndRes = available[Math.floor(Math.random() * available.length)];
                    rndRes.status = 'occupied';
                    rndRes.timeRemaining = Math.floor(Math.random() * 60) + 30; // Ocupan de 30s a 90s (rápido para la demo)
                    rndRes.queue = Math.floor(Math.random() * 2); // 0 o 1 en fila
                    needsUpdate = true;
                    ui.showToast(`👤 Alguien acaba de reservar: ${rndRes.name}`, 'info');
                }
            }

            // 3. Gestión Cola Activa del Usuario
            if (appState.activeQueue) {
                const target = appState.resources.find(r => r.id === appState.activeQueue.resourceId);
                if (target && target.status === 'available' && appState.activeQueue.position <= 1) {
                    ui.showToast(`¡Es tu turno para ${target.name}! Tienes 60 minutos.`);
                    appState.activeReservation = { resourceId: target.id, timeRemaining: 3600 };
                    target.status = 'occupied';
                    target.timeRemaining = 3600;
                    appState.activeQueue = null;
                    appState.changeView('dashboard');
                    return; // Ya redibuja todo
                }
                if (target) {
                    appState.activeQueue.estimatedTime = target.timeRemaining + (Math.max(0, appState.activeQueue.position - 1) * 30);
                    needsUpdate = true;
                }
            }

            // 4. Gestión Reserva Activa del Usuario
            if (appState.activeReservation) {
                if (appState.activeReservation.timeRemaining > 0) {
                    appState.activeReservation.timeRemaining--;
                    needsUpdate = true;
                }
                if (appState.activeReservation.timeRemaining <= 0) {
                    ui.showToast("Tu tiempo ha finalizado. ¡Esperamos que te hayas divertido!");
                    actions.cancelReservation();
                    return;
                }
            }

            if (needsUpdate) {
                if (appState.view === 'dashboard') {
                    ui.updateGrid();
                    ui.updateActiveStatus();
                } else if (appState.view === 'waiting') {
                    ui.renderWaitingRoom();
                }
            }
        }, 1000);


        const games = {
            activeIntervals: [],
            stop: function() {
                this.activeIntervals.forEach(clearInterval);
                this.activeIntervals = [];
                document.getElementById('minigames-menu').classList.remove('hidden');
                document.getElementById('minigame-active-container').classList.add('hidden');
                document.getElementById('minigame-canvas').innerHTML = '';
            },
            
            start: function(gameId) {
                document.getElementById('minigames-menu').classList.add('hidden');
                document.getElementById('minigame-active-container').classList.remove('hidden');
                const canvas = document.getElementById('minigame-canvas');
                canvas.innerHTML = '';
                
                const titles = { memory: 'Memoria Visual', tictactoe: 'Tres en Raya', connect4: '4 en Raya', whack: 'Caza de Topos' };
                document.getElementById('minigame-title').innerText = titles[gameId];

                if(gameId === 'connect4') this.playConnect4(canvas);
                if(gameId === 'whack') this.playWhack(canvas);
                if(gameId === 'memory') this.playMemory(canvas);
                if(gameId === 'tictactoe') this.playTicTacToe(canvas);
            },

            playConnect4: function(container) {
                // 4 en Raya (7 columnas x 6 filas)
                let board = Array(6).fill().map(() => Array(7).fill(null));
                let currentPlayer = 'red';
                let gameOver = false;

                const renderBoard = () => {
                    let html = `<div class="bg-blue-600 p-2 rounded-xl flex gap-1 h-full shadow-inner relative">`;
                    if(gameOver) html += `<div class="absolute inset-0 bg-black/50 rounded-xl flex flex-col items-center justify-center z-10 fade-in"><p class="text-white text-2xl font-bold mb-4">Gana el ${currentPlayer === 'red' ? 'Rojo' : 'Amarillo'}</p><button onclick="games.start('connect4')" class="px-4 py-2 bg-white text-black font-bold rounded-full">Rejugar</button></div>`;
                    
                    for(let c=0; c<7; c++) {
                        html += `<div class="flex flex-col gap-1 cursor-pointer group" onclick="games.dropC4(${c})">`;
                        for(let r=0; r<6; r++) {
                            const val = board[r][c];
                            const colorClass = val === 'red' ? 'bg-red-500 shadow-md' : val === 'yellow' ? 'bg-yellow-400 shadow-md' : 'bg-slate-800 shadow-inner group-hover:bg-slate-700 transition-colors';
                            html += `<div class="w-6 h-6 sm:w-10 sm:h-10 rounded-full ${colorClass}"></div>`;
                        }
                        html += `</div>`;
                    }
                    html += `</div>`;
                    container.innerHTML = html;
                };

                this.dropC4 = (col) => {
                    if(gameOver) return;
                    for(let r = 5; r >= 0; r--) {
                        if(!board[r][col]) {
                            board[r][col] = currentPlayer;
                            if(this.checkC4Win(board, r, col, currentPlayer)) {
                                gameOver = true;
                            } else {
                                currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
                            }
                            renderBoard();
                            return;
                        }
                    }
                };

                this.checkC4Win = (b, r, c, p) => {
                    const dirs = [[0,1], [1,0], [1,1], [1,-1]];
                    for(let [dr, dc] of dirs) {
                        let count = 1;
                        for(let i=1; i<=3; i++) { if(b[r+dr*i]?.[c+dc*i] === p) count++; else break; }
                        for(let i=1; i<=3; i++) { if(b[r-dr*i]?.[c-dc*i] === p) count++; else break; }
                        if(count >= 4) return true;
                    }
                    return false;
                };

                renderBoard();
            },

            playWhack: function(container) {
                // Caza de Topos (Reflejos)
                let score = 0;
                let activeIndex = -1;
                let gameActive = true;
                
                const render = () => {
                    if(!gameActive) {
                        container.innerHTML = `<div class="flex flex-col items-center fade-in"><i data-lucide="award" class="w-16 h-16 text-yellow-500 mb-4"></i><h2 class="text-2xl font-bold mb-2">¡Tiempo! Puntos: ${score}</h2><button onclick="games.start('whack')" class="px-6 py-2 bg-black text-white font-bold rounded-full mt-4">Jugar de nuevo</button></div>`;
                        lucide.createIcons();
                        return;
                    }

                    let html = `<div class="absolute top-2 left-4 text-slate-500 font-bold">Puntos: <span class="text-black text-xl">${score}</span></div>`;
                    html += `<div class="grid grid-cols-3 gap-2 sm:gap-4 p-4 mt-6">`;
                    for(let i=0; i<9; i++) {
                        const isActive = i === activeIndex;
                        html += `
                            <button onclick="games.whackHit(${i})" class="w-16 h-16 sm:w-20 sm:h-20 bg-slate-200 rounded-2xl flex items-center justify-center overflow-hidden border-b-4 border-slate-300 relative group active:border-b-0 active:translate-y-1 transition-all">
                                <div class="absolute inset-0 bg-slate-800 rounded-full w-[80%] h-[30%] mx-auto bottom-2 opacity-20"></div>
                                ${isActive ? `<div class="text-4xl sm:text-5xl animate-bounce-subtle absolute bottom-1">🐹</div>` : ''}
                            </button>
                        `;
                    }
                    html += `</div>`;
                    container.innerHTML = html;
                };

                this.whackHit = (i) => {
                    if(i === activeIndex && gameActive) {
                        score++;
                        activeIndex = -1; // Desaparece hasta el prox tick
                        render();
                    }
                };

                const interval = setInterval(() => {
                    if(!gameActive) return;
                    activeIndex = Math.floor(Math.random() * 9);
                    render();
                }, 800);

                const timeout = setTimeout(() => {
                    gameActive = false;
                    render();
                }, 20000); // 20 segundos de juego

                this.activeIntervals.push(interval, timeout);
                render();
            },

            playMemory: function(container) {
                const EMOJIS = ['⚽', '🏀', '🎮', '🃏', '♟️', '🎲'];
                let deck = [...EMOJIS, ...EMOJIS].sort(() => Math.random() - 0.5);
                let cards = deck.map((e,i) => ({id:i, emoji:e, flipped:false, matched:false}));
                let flippedCards = [];
                let matches = 0;
                let locked = false;

                const render = () => {
                    if(matches === EMOJIS.length) {
                        container.innerHTML = `<div class="flex flex-col items-center fade-in"><i data-lucide="trophy" class="w-16 h-16 text-yellow-500 mb-4 animate-bounce"></i><h2 class="text-xl font-bold mb-4">¡Memoria Perfecta!</h2><button onclick="games.start('memory')" class="px-6 py-2 bg-black text-white font-bold rounded-full">Jugar de nuevo</button></div>`;
                        lucide.createIcons();
                        return;
                    }
                    let html = `<div class="grid grid-cols-4 gap-2 h-full w-full max-w-sm p-2">`;
                    cards.forEach((c, i) => {
                        const show = c.flipped || c.matched;
                        html += `
                        <button onclick="games.flipCard(${i})" class="rounded-2xl text-3xl flex items-center justify-center transition-all duration-300 transform ${show ? 'bg-white shadow-md rotate-0 border border-slate-100' : 'bg-slate-300 hover:bg-slate-400 rotate-y-180 border-b-4 border-slate-400'}">
                            <span class="transition-opacity duration-300 ${show ? 'opacity-100' : 'opacity-0'}">${c.emoji}</span>
                        </button>`;
                    });
                    html += `</div>`;
                    container.innerHTML = html;
                };

                this.flipCard = (i) => {
                    if(locked || cards[i].flipped || cards[i].matched) return;
                    cards[i].flipped = true;
                    flippedCards.push(i);
                    render();

                    if(flippedCards.length === 2) {
                        locked = true;
                        setTimeout(() => {
                            let [a, b] = flippedCards;
                            if(cards[a].emoji === cards[b].emoji) {
                                cards[a].matched = cards[b].matched = true;
                                matches++;
                            } else {
                                cards[a].flipped = cards[b].flipped = false;
                            }
                            flippedCards = [];
                            locked = false;
                            render();
                        }, 800);
                    }
                };
                render();
            },

            playTicTacToe: function(container) {
                let board = Array(9).fill(null);
                let turn = 'X';
                let winner = null;

                const checkWin = () => {
                    const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
                    for(let l of lines) if(board[l[0]] && board[l[0]] === board[l[1]] && board[l[0]] === board[l[2]]) return board[l[0]];
                    return board.includes(null) ? null : 'Draw';
                };

                const render = () => {
                    if(winner) {
                        container.innerHTML = `<div class="flex flex-col items-center fade-in"><i data-lucide="${winner==='Draw'?'handshake':'trophy'}" class="w-16 h-16 text-${winner==='Draw'?'slate':'yellow'}-500 mb-4"></i><h2 class="text-2xl font-bold mb-4">${winner === 'Draw' ? '¡Empate!' : (winner === 'X' ? '¡Ganaste!' : 'Gana el Bot')}</h2><button onclick="games.start('tictactoe')" class="px-6 py-2 bg-black text-white font-bold rounded-full">Rejugar</button></div>`;
                        lucide.createIcons();
                        return;
                    }
                    let html = `<div class="grid grid-cols-3 gap-2 w-48 h-48 sm:w-64 sm:h-64">`;
                    board.forEach((c, i) => {
                        html += `<button onclick="games.tttMove(${i})" class="bg-white rounded-xl shadow-sm text-4xl sm:text-5xl font-bold flex items-center justify-center hover:bg-slate-50 border-2 border-slate-100 transition-colors ${c==='X'?'text-blue-500':c==='O'?'text-red-500':''}">${c||''}</button>`;
                    });
                    html += `</div>`;
                    container.innerHTML = html;
                };

                this.tttMove = (i) => {
                    if(board[i] || winner || turn === 'O') return;
                    board[i] = 'X';
                    turn = 'O';
                    winner = checkWin();
                    render();
                    
                    if(!winner) {
                        setTimeout(() => {
                            let empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
                            if(empty.length > 0) {
                                board[empty[Math.floor(Math.random() * empty.length)]] = 'O';
                                turn = 'X';
                                winner = checkWin();
                                render();
                            }
                        }, 500);
                    }
                };
                render();
            }
        };

        // Inicialización de íconos inicial
        lucide.createIcons();

    </script>
